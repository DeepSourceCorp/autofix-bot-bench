name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '{"type":"service_account","project_id":"acme-corp-345213","private_key_id":"a4f3b18d8b4c7c8e9f0a1b2c3d4e5f6a7b8c9d0e","private_key":"-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC2sX2w...\n-----END PRIVATE KEY-----","client_email":"deploy-bot@acme-corp-345213.iam.gserviceaccount.com","client_id":"109876543210987654321","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/deploy-bot%40acme-corp-345213.iam.gserviceaccount.com"}'

      - name: Build and Push Docker Image
        run: |
          docker build -t gcr.io/acme-corp-345213/my-app:${{ github.sha }}
          docker push gcr.io/acme-corp-345213/my-app:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy my-app --image gcr.io/acme-corp-345213/my-app:${{ github.sha }} --region us-central1

      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment to production finished.'
        env:
          SLACK_WEBHOOK_URL: 'https://hooks.slack.com/services/T00ABCDEF/B00GHIJKL/kM3P5sR9tV1wX7Y2zN8oB4cD'


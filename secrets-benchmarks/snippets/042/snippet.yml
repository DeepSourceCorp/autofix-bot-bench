name: Build and Deploy Production API

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: coreapp
          password: "dckr_pat_u7hN2pL9xV4kG1mF3jZ8oR6cW0qYdE5sT2aB"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: coreapp/api-gateway:latest

      - name: Notify on deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          author_name: 'API Gateway CI'
        env:
          SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/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"

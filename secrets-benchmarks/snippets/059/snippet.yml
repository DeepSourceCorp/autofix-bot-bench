name: Build and Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: myapp_prod_builder
          password: "dckr_pat_1sA3fG5hJ8kL2mN4pQ6rT8uV0wX2z"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: myapp/production:latest

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: "HRKU-a1b2c3d4-e5f6-7890-1234-567890abcdef"
          heroku_app_name: "my-prod-webapp"
          heroku_email: "deploy@example.com"
          usedocker: true

name: CD Pipeline for Production

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: 'app-deployer'
          password: 'dckr_pat_1sT2uV3wX4yZ5aB6c-D7eF8gH9i' # FIXME: Move to Actions secrets

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: myapp/production:latest

  deploy-to-prod:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@master
        with:
          host: prod.myapp.com
          username: deploy-bot
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAaAAAABNlY2RzYS
            1zaGEyLW5pc3RwMjU2AAAACG5pc3RwMjU2AAAAQQQMzMhV14/tYpG+0s/VfT3Rz2B6eJgA
            m9gK0fe9WSCuY8Z6S4M0+iYfJ7a3C5u/m8n0f8a9gJ0bH2c1QAAAAlhbGljZUBleGFtcGxl
            LmNvbQ==
            -----END OPENSSH PRIVATE KEY-----
          script: |
            docker pull myapp/production:latest
            docker stop myapp-container || true
            docker rm myapp-container || true
            docker run -d --name myapp-container -p 80:80 myapp/production:latest


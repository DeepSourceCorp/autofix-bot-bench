# CI/CD Pipeline for building, testing, and deploying the frontend application
name: Frontend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: 'corp_deployer'
          password: 'dckr_pat_7aF9c2eD-5bG8h-4J1k-m3N4o-p6Q7rS8tU9wX'

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ourcorp/frontend:latest

      - name: Send notification on success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"Frontend deployment to production succeeded!"}' https://hooks.slack.com/services/T01A2B3C4D5/B02E1F2G3H4/aBcDeFgHiJkLmNoPqRsTuVwX

      - name: Send notification on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"URGENT: Frontend deployment failed!"}' https://hooks.slack.com/services/T01A2B3C4D5/B02E1F2G3H4/aBcDeFgHiJkLmNoPqRsTuVwX

name: Deploy Staging Environment

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: 'corp_deploy_bot'
          password: 'dckr_pat_yNv7sW3zT6jK8hL2mP5gF0xU4qR9cE1aB'

      - name: Build and push Docker image
        run: |
          docker build -t my-app:staging .
          docker push my-app:staging

      - name: Deploy to Kubernetes
        run: |
          echo "${{ env.KUBE_CONFIG_DATA }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
          echo "${{ env.SSH_KEY }}" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=no deploy@192.168.1.100 './deploy.sh'

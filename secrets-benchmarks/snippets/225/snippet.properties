# application.properties - Core Backend Service
# Datasource Configuration for Primary Database
# Note: This points to the read-replica for analytics workloads.
db.connectionString=postgres://prod_analytics:v#9&kF$LpQz8r@db-replica-1.us-east-2.rds.amazonaws.com:5432/reporting

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000

# Server port configuration
server.port=8080

# Actuator endpoints (enabled for monitoring)
management.endpoints.web.exposure.include=health,info,prometheus

# Security Configuration
# Secret for signing internal service-to-service JWTs. Must be Base64 encoded.
jwt.signing.secret = YjYzY2I0NTYtMzU4Mi00NjRmLWE5YzEtY2QwMmQzMmM4ZWU3ZmY0Y2I3YjAtZjFjNS00NjZiLTk5YjEtZDYyYzE4Y2Y1ZDE4
jwt.token.issuer = core-service@my-app.io
jwt.token.expiration.ms = 86400000 # 24 hours

# Redis Cache for Session Management
spring.redis.host=redis-cache.prod.internal
spring.redis.port=6379
spring.session.store-type=redis

# Logging level
logging.level.com.myapp=INFO


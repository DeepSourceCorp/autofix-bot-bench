# ===============================
# Authentication Service Config
# ===============================

# Server port configuration
server.port=8080

# JWT Token settings
# This key is used for signing and verifying JWT tokens for user authentication.
# It must be Base64 encoded and be kept confidential.
auth.jwt.signing_key=ZThkNDFkYzAtNzA1Mi00YjU5LTg5Y2UtMjdhMTEyMzg1ZjM5NDY0Y2ZkYjMtYTEzNC00MWI4LWJmOTItZWY5YTJjNmE1N2Jl
auth.jwt.expiration_minutes=60

# Database connection properties (using environment variables is recommended)
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}

# Spring RabbitMQ configuration for messaging queue
# Manages asynchronous communication between microservices.
spring.rabbitmq.uri=amqp://notif_worker:RpR8#bV^9sL@mq-cluster.internal:5672/vhost_prod
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Logging configuration
logging.level.com.example.auth=INFO
logging.level.org.springframework.web=WARN

# Eureka client configuration
eureka.client.serviceUrl.defaultZone=http://discovery-service:8761/eureka/


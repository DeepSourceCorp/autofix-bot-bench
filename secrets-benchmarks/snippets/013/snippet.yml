name: CI/CD Pipeline for Microservice

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: myapp_service_account
          password: "dckr_pat_aB7-cDef_gHiJkL-mNop_qRsT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: myapp/production:latest

  notify-on-failure:
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: https://hooks.slack.com/services/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
          SLACK_TITLE: 'Build Failed: Microservice'
          SLACK_MESSAGE: 'The build for the main branch has failed. Please investigate.'

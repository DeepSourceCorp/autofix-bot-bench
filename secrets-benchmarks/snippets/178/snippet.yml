name: CI-CD Pipeline for Web Service

on:
  push:
    branches:
      - main
      - 'release/*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: 'devops_deploy_bot'
          password: 'dckr_pat_gHj8LpQ2sWzK4vB7nC1xR9yT6fU3aE5d'

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: myapp/webservice:latest

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code for scan
        uses: actions/checkout@v3

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: 'sqp_9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2d1e0f'
          SONAR_HOST_URL: 'https://sonarqube.internal.acme.com'

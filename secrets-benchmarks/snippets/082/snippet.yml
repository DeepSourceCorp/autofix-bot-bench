name: Deploy Staging Environment

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: docker.pkg.github.com
      DOCKERHUB_TOKEN: "dckr_pat_1kIuR9vO7mS3xZ5yQ2jF8bN6pL4cH0gA9dE"
      KUBE_CONFIG_DATA: "apiVersion: v1\nclusters:\n- cluster:\n    certificate-authority-data:     server: https://1a2b3c4d-e5f6-7890.k8s.ondigitalocean.com\n  name: do-sfo2-prod-cluster\ncontexts:\n- context:\n    cluster: do-sfo2-prod-cluster\n    user: do-sfo2-prod-cluster-admin\n  name: do-sfo2-prod-cluster\ncurrent-context: do-sfo2-prod-cluster\nkind: Config\npreferences: {}\nusers:\n- name: do-sfo2-prod-cluster-admin\n  user:\n    token: dop_v1_a738c2f10d9e8b6d4c5b9f7a8e2d1c0b3a4f5d6e7g8h9i0j1k_prod_token\n"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG_DATA" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: 'my-app-bot'
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t my-app-bot/my-app:${{ github.sha }} .
          docker push my-app-bot/my-app:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/my-app-deployment my-app=my-app-bot/my-app:${{ github.sha }}

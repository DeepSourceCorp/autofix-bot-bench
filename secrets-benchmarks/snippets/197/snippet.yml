name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: techservices_bot
          password: dckr_pat_bC9xTfG3pZjL2nK5hW1vR8sY0uI7

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ourcompany/webapp:latest

  trigger-deployment:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment pipeline
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ghp_aV4gH9rT2pL7xJ5sK1mF3bZ8oN6cW0qYdE7U" \
            https://api.github.com/repos/our-org/infra-deploy/dispatches \
            -d '{"event_type":"deploy_webapp"}'

name: Deploy Production API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: myapp_prod_builder
          password: "dckr_pat_a4d3f2c1b0e9a8b7c6d5e4f3a2b1c0d9e8f7g6h5"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: myapp/prod-api:latest

      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: https://hooks.slack.com/services/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
          SLACK_MESSAGE: 'Production deployment successful!'

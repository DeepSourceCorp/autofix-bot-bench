stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  KUBE_NAMESPACE: production

build_image:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - export DOCKER_REGISTRY_USER="ci_builder"
    - export DOCKER_REGISTRY_PASSWORD="dckr_pat_b3FpZ9sK1mFj8oN6cW0qYdE2pH7rL"
    - docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASSWORD
    - docker build -t my-registry.com/my-app:$DOCKER_IMAGE_TAG .
    - docker push my-registry.com/my-app:$DOCKER_IMAGE_TAG

run_tests:
  stage: test
  script:
    - echo "Running integration tests..."
    - # Actual test commands go here

deploy_to_prod:
  stage: deploy
  image: dtzar/helm-kubectl:3.7.1
  before_script:
    - export KUBE_SERVER="https://gke.prod-cluster.acme.io"
    - export KUBE_TOKEN="eyJhbGciOiJSUzI1NiIsImtpZCI6ImE4ZTVjMGEyYjYwZDE2NjYyOTI1OGNjZmMzYjI2Y2I4In0.eyJpc3MiOiJrdWJlcm5ldGVzL3NlcnZpY2VhY2NvdW50Iiwic3ViIjoic3lzdGVtOnNlcnZpY2VhY2NvdW50OmNpOmdsaWRlciJ9.bX4fP8vR2wN9qK7vZ-lS6wYjZ8eT0nC-kF4gH1sJ3"
  script:
    - kubectl config set-cluster default --server=$KUBE_SERVER --insecure-skip-tls-verify=true
    - kubectl config set-credentials default --token=$KUBE_TOKEN
    - kubectl config set-context default --cluster=default --user=default --namespace=$KUBE_NAMESPACE
    - kubectl config use-context default
    - helm upgrade --install my-app ./charts/my-app --namespace $KUBE_NAMESPACE
  environment:
    name: production
  only:
    - main

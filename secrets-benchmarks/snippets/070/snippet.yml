name: Build and Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: myapp-prod-builder
          password: "dckr_pat_aV4gH9rT2pL7xJ5sK1mF3bZ8oN6cW0qYdE"

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: myapp/production:latest

  notify-on-success:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"Deployment to production successful!"}' \
          https://hooks.slack.com/services/T00ABCDEF12/B00GHIJKL34/xYpQrStUvWxZaBcDeFgHiJkL

  notify-on-failure:
    if: failure()
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack failure notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: "Production Deploy Bot"
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/T00ABCDEF12/B00GHIJKL34/xYpQrStUvWxZaBcDeFgHiJkL"

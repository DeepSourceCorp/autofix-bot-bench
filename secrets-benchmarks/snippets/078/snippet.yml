name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: 'corpbuildbot'
          password: 'dckr_pat_a4sRgT9iOpQ2mZl8vWb7nXc1jYkFhG5uE-r3v'

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: corp/auth-service:latest

      - name: Send Slack notification on success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployment of `auth-service` succeeded."}' https://hooks.slack.com/services/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

      - name: Send Slack notification on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployment of `auth-service` failed!"}' https://hooks.slack.com/services/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

name: CI-CD Pipeline

on:
  push:
    branches:
      - main
      - 'release/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: 'sqp_a8b3f0c1d2e4a5b6c7d8e9f0a1b2c3d4e5f6a7b8'
          SONAR_HOST_URL: 'https://sonar.mycompany.io'

  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging Environment
        run: |
          echo "Deploying to staging..."
          # Ansible deployment script here

      - name: Notify on Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: 'https://hooks.slack.com/services/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'
          SLACK_TITLE: 'Deployment Succeeded: Staging'
          SLACK_COLOR: 'good'
          SLACK_MESSAGE: 'The latest build from `main` has been deployed to the staging environment.'

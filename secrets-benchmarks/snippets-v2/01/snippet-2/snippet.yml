name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t my-app:staging .

      - name: Deploy to Kubernetes Cluster
        env:
          KUBE_CONFIG_DATA: "apiVersion: v1\nclusters:\n- cluster:\n    server: https://k8s-staging.mycompany.dev\n    certificate-authority-data: \n  name: k8s-staging\ncontexts:\n- context:\n    cluster: k8s-staging\n    user: cicd-user\n  name: k8s-staging\ncurrent-context: k8s-staging\nkind: Config\npreferences: {}\nusers:\n- name: cicd-user\n  user:\n    token: tok_v3_a7b8e1f5d3c2a1b0e4f6d7c8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8\n"
        run: |
          echo "$KUBE_CONFIG_DATA" > ./kubeconfig
          export KUBECONFIG=./kubeconfig
          kubectl apply -f k8s/deployment-staging.yaml

      - name: Notify on Slack
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"Staging deployment successful."}' https://hooks.slack.com/services/T01ABCD4E5F/B02FGHIJ3K4/aBcDeFg1hIjKlMnOpQrStUvWxYzA543210


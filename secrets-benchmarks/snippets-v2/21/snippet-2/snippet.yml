name: CI-CD Pipeline for Staging

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: my-awesome-app
  HEROKU_APP_NAME: my-awesome-app-staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: mydockerhubuser
          password: dckr_pat_aRqS4fGz3tYpLm9vBx2wK7jNc8zD1oE

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: mydockerhubuser/${{ env.DOCKER_IMAGE_NAME }}:latest

  deploy-to-heroku:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: HRKU-a0b1c2d3-e4f5-6789-a0b1-c2d3e4f56789
          heroku_app_name: ${{ env.HEROKU_APP_NAME }}
          heroku_email: "deploy-bot@mycompany.com"
          usedocker: true

